[package]
name = "makepad-example-media-player"
version = "1.0.0"
edition = "2021"

[dependencies]
makepad-widgets = { path = "../../widgets", version = "2.0.0" }
symphonia = { version = "0.5", default-features = false, features = [
    "mp3",
    "wav",
    "aiff",
    "flac",
    "isomp4",
    "alac",
    "pcm",
] }
